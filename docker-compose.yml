version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rsci_fyp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rsci_fyp_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: rsci_fyp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rsciminioadmin
      MINIO_ROOT_PASSWORD: rsciminiosecret2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
